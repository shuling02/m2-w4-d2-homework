<!DOCTYPE html>
<html lang="en">
<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            font-family:Arial, Helvetica, sans-serif;
        }
        #leftside {
            float:left;
            width: 30%;
            min-height: 1200px;
            background-color:rgb(77, 192, 154);
        }
        #rightside {
            float:left;
            width: 70%;
            min-height: 1200px;
            background-color:rgb(238, 226, 192);
            position:relative;
        }
        #container {
            background-color:rgba(255, 255, 255, 0.85);
            position: absolute;
            top: 15%;
            left: 15%;
            min-width: 1100px;
            min-height: 1050px;
            border-radius: 0.7em;
        }
        header {
            height: 50px;
            background-color:rgba(231, 229, 229, 0.5);
            font-size: 2.75em;
            padding:0.5em;
            color:rgb(216, 150, 7);
        }
        header span {
            font-family: 'Sacramento', cursive;
        }
        main {
            position: relative;
        }
        main h2 {
            position: absolute;
            left: 20%;
            top: 30px;
            margin: 25px 0 200px 50px;
            color:rgb(60, 190, 160);
            text-transform: uppercase;
        }
        main #photos img {
            margin: 0.75em;
            border: 0.85em solid rgb(255, 255, 255);
        }
        section#blogposts {
            position: absolute;
            left: 20%;
            top: 70px;
            padding: 50px;
        }
        main .post {
            margin: 25px;
            padding: 25px;
            border: 2px solid rgba(83, 78, 58, 0.6);
            border-radius: 0.5em;
        }
        footer {
            position: absolute;
            bottom: 0;
            height: 50px;
            width: 100%;
            text-align: center;
            font-size: 0.85em;
        }

        .profile-image {
            width: 30px;
            height: 30px;
            object-fit: cover;
            cursor: pointer;
            vertical-align: middle;
            margin-right: 8px;
        }

        .profile-image:hover {
            opacity: 0.8;
        }

        .author-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .author-modal-content {
            position: relative;
            background-color: rgba(20, 20, 20, 0.95);
            color: white;
            width: 320px;
            max-width: 85%;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .author-modal-content h2 {
            position: static;
            margin: 0 25px 20px 0;
            color: white;
            text-transform: none;
            font-size: 20px;
        }

        .author-modal-content p {
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .modal-close {
            position: absolute;
            top: 8px;
            right: 10px;
            border: none;
            background: transparent;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .close-button {
            cursor: pointer;
            padding: 5px 12px;
        }

    </style>

    

</head>
<body>
    <aside id="leftside"></aside>
    <aside id="rightside"></aside>
    <div id="container">
    <header>
        <blog-title :title="blog.title"></blog-title>
    </header>

    <main>
    
    <aside id="photos">
        <img src="images/chili.jpg" alt="White Chicken Chili" width="180">
    </aside>
    <comments-heading
        :heading="comments.heading">
    </comments-heading>
    
    <section id="blogposts">
         <blog-post
            v-for="post in comments.posts"
            :key="post.id"
            :post="post"
            @show-author="showAuthor">
        </blog-post>
    </section>

    <div
        v-if="selectedAuthor"
        class="author-modal"
        @click.self="closeAuthor"
    >
        <div class="author-modal-content">
            <button
                class="modal-close"
                @click="closeAuthor"
                aria-label="Close author information"
            >
                &times;
            </button>

            <h2>{{ selectedAuthor.author }}</h2>

            <p>
                <strong>Foodie Level:</strong>
                {{ selectedAuthor.foodieLevel }}
            </p>

            <p>
                <strong>Bio:</strong>
                {{ selectedAuthor.bio }}
            </p>

            <button class="close-button" @click="closeAuthor">
                Close
            </button>
        </div>
    </div>


    </main>

    <footer>
        &copy; Copyright FOOD BLOG
    </footer>
    
</div>


<script>
    
    Vue.component('blog-title', {
        props: ['title'],
        template: '<span>{{ title }}</span>'
    });

    
    Vue.component('comments-heading', {
        props: ['heading'],
        template: '<h2>{{ heading }}</h2>'
    });


    Vue.component('blog-post', {
        props: ['post'],

        template: `
            <div class="post">
                <img
                    :src="'images/profile.png'"
                    alt="Author profile"
                    class="profile-image"
                    @click="$emit('show-author', post)"
                    title="Click to view author information"
                >

                <span class="author">{{ post.author }}</span> —
                <span class="date">{{ post.date }}</span>
                <span class="reply">{{ post.reply }}</span>

                <p>{{ post.message }}</p>
            </div>
        `
    });


    new Vue({
        el: '#container',

        data: {
            blog: {
                title: 'Food Blog'
            },

            comments: {
                heading: 'Comments',

                posts: [
                    {
                        id: 1,
                        author: 'Brianna',
                        date: 'February 18, 2021 @ 3:30 pm',
                        reply: 'REPLY',
                        message: 'Was amazing! My Walmart didn’t have coriander in stock and didn’t have ground cumin. I used serrano instead of jalapeño. It was just like my favorite tortilla soup from BJs. I am sending this recipe to my family. I want everyone to try it!',
                    
                        foodieLevel: 'Novice',
                        bio: 'Food enthusiast. Love to cook and experiment. Into only organic, fat free, sugar free stuffs!'

                    },
                    {
                        id: 2,
                        author: 'LINH',
                        date: 'February 15, 2021 @ 9:46 am',
                        reply: 'REPLY',
                        message: 'I just made this soup today and it’s so tasty! didn’t have corn at home but still turned out very good. It’s a winner! I made beef chili for my parents; but since my dad has gout he can’t eat beef; this white chicken chili is perfect for him. Thank you Lisa!',
                        
                        foodieLevel: 'Newcomer',
                        bio: 'Love food! Grew up with meat and potatoes. Recently venture outside my comfort zone. Loving everything I have been eating so far. Thai is my favorite at this time.'

                    },
                    {
                        id: 3,
                        author: 'CATHERINE LEONARDO',
                        date: 'February 13, 2021 @ 12:58 pm',
                        reply: 'REPLY',
                        message: 'I LOVE this White Chicken Chili! You are right, it is satiating meal—delicious with toasted bread. Refreshingly different taste than any chicken chili I’ve made in the past. I made it exactly as written and added some chopped zucchini, carrots, and celery. Instead of shredding the chicken, I chopped it into small pieces. It freezes very well. Will be an all-time favorite, for sure.',
                        
                        foodieLevel: 'Mentor',
                        bio: 'I have to say I never was the adventurous type until 2 years ago. My boyfriend, who is of Japanese background, exposed me to other cultural food and I have never look back since!'

                    },
                    {
                        id: 4,
                        author: 'KALI',
                        date: 'February 13, 2021 @ 11:31 am',
                        reply: 'REPLY',
                        message: 'This recipe is dynamite! My partner usually won’t eat beans but he finished the whole pot (darn was hoping to have some for leftovers haha). This is crowd-pleaser that I am going to add to my regular recipe rotation. Thanks so much, Lisa!',
                        
                        foodieLevel: 'Novice',
                        bio: 'Food is my passion. So is cooking. I love to experiment and try new things. I have to admit I’m a food whore! Invite me over for dinner and I’ll be there!'

                    }
                ]
            },

            selectedAuthor: null
        },

        methods: {
            showAuthor: function (post) {
                this.selectedAuthor = post;
            },

            closeAuthor: function () {
                this.selectedAuthor = null;
            }
        }
    });
</script>

</body>
</html>
