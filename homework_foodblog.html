<!DOCTYPE html>
<html lang="en">
<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css"> 

</head>


<body>
    <div id="container">
        <div class="container-fluid">
            <div class="row">

                <aside id="leftside" class="col-md-3">
                </aside>

                <div id="rightside" class="col-md-9">

                    <header class="p-3">
                        <div class="d-flex flex-wrap align-items-center justify-content-between">
                            <blog-title :title="blog.title"></blog-title>

                            <blog-navigation></blog-navigation>
                        </div>
                    </header>

                    <main class="p-3">
                        <div class="row">

                            <div class="col-12 col-md-4" id="photos">
                                <food-image></food-image>
                            </div>

                            <div class="col-12 col-md-8">
                                <comments-heading
                                    :heading="comments.heading">
                                </comments-heading>

                                <section id="blogposts">
                                    <blog-post
                                        v-for="post in comments.posts"
                                        :key="post.id"
                                        :post="post"
                                        @show-author="showAuthor">
                                    </blog-post>
                                </section>
                            </div>

                        </div>
                    </main>

                    <footer class="text-center p-3">
                        &copy; Copyright FOOD BLOG
                    </footer>

                    <div
                        v-if="selectedAuthor"
                        class="author-modal"
                        @click.self="closeAuthor"
                    >
                        <div class="author-modal-content">
                            <button
                                class="modal-close"
                                @click="closeAuthor"
                                aria-label="Close author information"
                            >
                                &times;
                            </button>

                            <h2>{{ selectedAuthor.author }}</h2>

                            <p>
                                <strong>Foodie Level:</strong>
                                {{ selectedAuthor.foodieLevel }}
                            </p>

                            <p>
                                <strong>Bio:</strong>
                                {{ selectedAuthor.bio }}
                            </p>

                            <button class="close-button" @click="closeAuthor">
                                Close
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
<script src="app.js"></script>

</body>
</html>
